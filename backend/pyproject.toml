[project]
name = "mentoring-platform-backend"
version = "0.1.0"
description = "Infrastructure foundation for the Mentoring Platform API"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.16.5,<2",
  "asyncpg>=0.30.0,<1",
  "email-validator>=2.3,<3",
  "fastapi>=0.116.1,<1",
  "prometheus-client>=0.23,<1",
  "pwdlib[argon2]>=0.3,<1",
  "pydantic-settings>=2.10.1,<3",
  "pyjwt>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1",
  "mypy>=1.17.1,<2",
  "pytest>=8.4.1,<9",
  "pytest-asyncio>=1.1.0,<2",
  "ruff>=0.12.10,<1",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
